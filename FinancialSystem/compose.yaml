services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: FinancialSystem
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: luan
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u luan -p123456 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/FinancialSystem?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: luan
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,https://faqs-combo-went-teaching.trycloudflare.com
    ports:
      - "8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - backend
    command: tunnel --no-autoupdate --url http://backend:8080
    restart: unless-stopped
