spring.config.import=optional:file:./src/main/resources/application-mail-local.properties,optional:file:./FinancialSystem/src/main/resources/application-mail-local.properties
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.application.name=FinancialSystem
spring.datasource.url=jdbc:mysql://localhost:3306/FinancialSystem?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=luan
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.main.allow-bean-definition-overriding=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
jwt.secret=${JWT_SECRET:minha-chave-super-secreta-em-producao-jwt-32-chars}
app.encryption.secret=${APP_ENCRYPTION_SECRET:minha-chave-super-secreta-em-producao-jwt-32-chars}

olist.api.base-url=${OLIST_API_BASE_URL:https://api.tiny.com.br/public-api/v3}
olist.oauth.token-url=${OLIST_OAUTH_TOKEN_URL:https://accounts.tiny.com.br/realms/tiny/protocol/openid-connect/token}
olist.webhook.secret=${OLIST_WEBHOOK_SECRET:}

# Password recovery SMTP (Gmail defaults; configure credentials in the environment)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:finsysmavie@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:finsysmavie@gmail.com}}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
